name: Bplus Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests
      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.8915132708:AAHVEZBejWE_MV0rZOLR82ajdLcWQ16LspM }}
          TELEGRAM_CHAT_ID: ${{ secrets.5121253246 }}
        run: python bplus_bot.py
